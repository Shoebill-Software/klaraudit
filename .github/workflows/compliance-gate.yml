# Optional sample: scan a staging URL with KlarAudit in CI.
# Set repository variable KLARAUDIT_STAGING_URL, or pass staging_url on workflow_dispatch.
# PRs without a staging URL are skipped (does not fail the product repo CI).

name: Compliance Gate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      staging_url:
        description: Staging URL to scan
        required: true
        type: string

concurrency:
  group: compliance-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-staging:
    name: Scan staging URL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_URL: ${{ github.event.inputs.staging_url || vars.KLARAUDIT_STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve staging URL
        id: target
        shell: bash
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "KLARAUDIT_STAGING_URL is unset; skipping compliance gate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build KlarAudit image
        if: steps.target.outputs.skip != 'true'
        run: docker build -t klaraudit .

      - name: Run KlarAudit against staging
        if: steps.target.outputs.skip != 'true'
        run: >
          docker run --rm --init --ipc=host
          klaraudit scan "$STAGING_URL" --ci --format json
